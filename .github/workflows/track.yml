name: Track hotel prices
on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py
      - name: Save results
        run: |
          git config user.name "hotel-tracker"
          git config user.email "hotel-tracker@users.noreply.github.com"
          git add docs/prices.json docs/offers.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
